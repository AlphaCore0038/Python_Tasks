{% extends "base.html" %}
{% block title %}{{ heading }} | Task Manager{% endblock %}

{% block content %}
<div class="card">
  <h1>{{ heading }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Save</button>
    <a class="btn secondary" href="{% url 'task-list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
