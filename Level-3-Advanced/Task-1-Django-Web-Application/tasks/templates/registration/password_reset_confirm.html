{% extends "base.html" %}
{% block title %}Set New Password | Task Manager{% endblock %}

{% block content %}
<div class="card">
  <h1>Set a new password</h1>
  {% if validlink %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn" type="submit">Change password</button>
    </form>
  {% else %}
    <p class="errorlist">This reset link is invalid or has expired.
      <a href="{% url 'password_reset' %}">Request a new one.</a></p>
  {% endif %}
</div>
{% endblock %}
