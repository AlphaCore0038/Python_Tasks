{% extends "base.html" %}
{% block title %}Register | Task Manager{% endblock %}

{% block content %}
<div class="card">
  <h1>Create an account</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Register</button>
  </form>
  <p class="muted">Already registered? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
