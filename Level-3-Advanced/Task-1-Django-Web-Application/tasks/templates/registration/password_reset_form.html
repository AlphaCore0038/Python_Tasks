{% extends "base.html" %}
{% block title %}Reset Password | Task Manager{% endblock %}

{% block content %}
<div class="card">
  <h1>Reset your password</h1>
  <p class="muted">Enter your email address and we will send you a reset link.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Send reset link</button>
  </form>
</div>
{% endblock %}
